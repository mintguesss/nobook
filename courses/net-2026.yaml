# 企業電腦網路（週二 6-8 節 14:00-16:50，I1-404）
#
# 術語表取自 tests/fixtures/net_real.wav 的實際授課內容
# （2026-09-15 週二 15:27 的錄音，主題是雲端服務模型）。
#
# 挑選依據是實際看到的 ASR 錯誤：
#   IaaS/SaaS → IAS/SAS、SaaS → sms、PaaS → PAASM、
#   雲端服務 → 原端服務、virtual client → virtual kind、
#   電算中心 → 電傳中心／店家中心／電訊中心（同一堂三種錯法）
id: net-2026
name: 企業電腦網路
instructor: 陳奕明
asr_prompt: |
  以下是大學企業電腦網路課程的錄音，講者為陳奕明教授，
  內容包含雲端服務模型、虛擬化與網路架構。
  常見術語：雲端服務、CSP、cloud service provider、ISP、IaaS、SaaS、PaaS、
  虛擬機器、虛擬化、virtualization、伺服器、server、client、
  電算中心、頻寬、資料中心、應用程式、雲端平臺、資訊安全。
glossary:
  - 雲端服務
  - 雲端平臺
  - CSP
  - cloud service provider
  - ISP
  - IaaS
  - SaaS
  - PaaS
  - 虛擬機器
  - 虛擬化
  - virtualization
  - 伺服器
  - server
  - client
  - 電算中心
  - 頻寬
  - 資料中心
  - 應用程式
  - 資訊安全

# 這堂要邊上課邊填學習單，下課立刻交。欄位固定四欄，順序不能動。
#
# content 的則數刻意開得很大：使用者要的是能自己挑的素材庫，不是壓縮過的
# 摘要。style: detail 會要求寫出名詞解釋與細節，而不是結論式的標題。
#
# 二三四欄的 hint 不要寫成句型範本。之前寫「寫我原本怎麼想、現在怎麼看」，
# 模型就照抄成「我原本以為X，但老師說Y」——六則反思全部同一個模子。
# 現在改成指定「要做什麼思考動作」，句型交給 prompt 去管。
handcopy:
  target_chars: 5200
  sections:
    - id: content
      title: 今天上課內容
      count: [20, 60]
      style: detail
      hint: 照時間順序涵蓋整堂課的每一個段落；專有名詞、英文縮寫、協定、數字規格都要有一則解釋它是什麼、用來做什麼
    - id: impressive
      title: 今天上課內容中印象深刻的部分
      pick: 2
      count: [5, 8]
      hint: >-
        挑出課堂上不是理所當然的地方：老師花最多時間解釋的、跟一般直覺相反的、
        用具體數字或案例撐起來的、或是兩個概念的界線被劃清楚的那一刻。
        寫出它為什麼不是顯而易見的，不要只說「老師強調了什麼」。
        **這一欄以陳述為主**，說清楚那個反直覺的點本身，不要寫成一串問句。
    - id: thoughts
      title: 對某些內容或是事件的想法
      pick: 2
      count: [5, 8]
      hint: >-
        針對課堂上某個具體說法做技術上的回應：它成立的前提是什麼、
        什麼情境下會失效、代價或取捨在哪、跟你已知的其他技術怎麼接、
        老師沒有展開的那一步會怎麼樣。可以質疑、可以追問、可以延伸，
        但要扣住一個具體的技術內容，不要寫感想。
        **多數要寫成判斷句**（「X 成立的前提是 Y，少了 Y 就只是理論」），
        追問留給真的答不出來的那一兩則就好。
    - id: reflection
      title: 今日反思
      pick: 1
      count: [5, 8]
      # 這一欄要寫出「原本的判斷標準 → 哪裡不夠 → 下次改看什麼」這條推論，
      # 用預設的 40-70 字會被壓成一句結論，過程整個不見
      chars: [80, 130]
      hint: >-
        **不要分析技術本身，那是上一欄的工作。這一欄的主角是「我」。**
        每一則都必須出現一個關於你自己的具體陳述：你原本用什麼標準做判斷、
        那個標準哪裡太粗糙、你在哪件事上會因此選錯、下次遇到什麼情況你會
        改看什麼指標、這堂課跟你修過的哪門課或做過的哪件事接得起來。
        只講技術而沒有講到自己的那一則不算數，直接換掉。
        **但不可以編造你不知道的個人經歷**（「我去年做過某某專案」
        「我大三時如何如何」）——你不知道他做過什麼。只能寫判斷標準
        本身怎麼變、下次遇到什麼情況會改看什麼。
        也不要寫「學到很多」「以後會更注意」這種空話。
