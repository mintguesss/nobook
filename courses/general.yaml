# 一般錄音：沒有專屬詞庫的預設設定。
#
# 拿任何一段錄音來轉文字、產生筆記都可以用這個，不需要先準備什麼。
# 跟「為某一門課調過的設定」的差別只有兩件事，兩件都是詞彙相關：
#
#   1. asr_prompt  餵給 Whisper 當 initial_prompt。寫上這堂課會出現的
#      術語，辨識時遇到這些詞會傾向轉成正確寫法。實測在 VAD 分段的
#      流程下，辨識正確率差 46%——這是最有感的一項。
#   2. glossary    兩個用途：注入摘要模型的 system prompt（讓它知道
#      這些詞要照原樣寫），以及近似音修正（把逐字稿裡讀音接近術語表
#      的詞改回來）。
#
# 兩個都留空也完全可以運作，只是專有名詞會比較容易出錯。要為某一門課
# 調的話，複製這個檔案改個 id，把課堂上真的會講的詞填進去就好。
# 詞怎麼挑：先錄一堂，看逐字稿裡哪些詞被聽錯，把「正確的寫法」填進去，
# 不要憑空想像會出現什麼。
id: general
name: 一般錄音
instructor: ""
asr_prompt: |
  以下是中文演講或課程的錄音內容。
glossary: []
